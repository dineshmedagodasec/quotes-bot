name: Post Quote to Facebook and YouTube

on:
  schedule:
    - cron: '30 1 * * *'    # 7:00 AM Sri Lanka
    - cron: '30 6 * * *'    # 12:00 PM Sri Lanka
    - cron: '30 13 * * *'   # 7:00 PM Sri Lanka
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests Pillow python-dotenv moviepy gTTS google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Run bot
        run: python main.py
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
