name: Post Quote to Facebook and YouTube
on:
  schedule:
    - cron: '30 1 * * *'    # 7:00 AM Sri Lanka (UTC+5:30)
    - cron: '30 6 * * *'    # 12:00 PM Sri Lanka (UTC+5:30)
    - cron: '30 13 * * *'   # 7:00 PM Sri Lanka (UTC+5:30)
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests Pillow python-dotenv moviepy gTTS google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Run bot
        run: python main.py
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          FACEBOOK_ALBUM_ID: ${{ secrets.FACEBOOK_ALBUM_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
