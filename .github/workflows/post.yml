name: Post Quote to Facebook and YouTube
on:
  schedule:
    - cron: '0 11 * * *'   # 6:00 AM US Eastern
    - cron: '0 13 * * *'   # 8:00 AM US Eastern
    - cron: '0 17 * * *'   # 12:00 PM US Eastern
    - cron: '0 22 * * *'   # 5:00 PM US Eastern
    - cron: '0 1 * * *'    # 8:00 PM US Eastern
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ✅ STEP 1: Install ImageMagick and open-source system fonts
      - name: Install System Dependencies (ImageMagick & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick gsfonts xfonts-base xfonts-75dpi

      # ✅ STEP 2: Override ImageMagick's default Linux security policy restriction for MoviePy
      - name: Configure ImageMagick Permissions Policy
        run: |
          sudo sed -i 's/domain="coder" rights="none"/domain="coder" rights="read|write"/g' /etc/ImageMagick-6/policy.xml

      - name: Install dependencies
        run: |
          pip install requests Pillow python-dotenv moviepy gTTS edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run bot
        run: python main.py
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          FACEBOOK_ALBUM_ID: ${{ secrets.FACEBOOK_ALBUM_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          YT_PLAYLIST_MOTIVATION: ${{ secrets.YT_PLAYLIST_MOTIVATION }}
          YT_PLAYLIST_SUCCESS: ${{ secrets.YT_PLAYLIST_SUCCESS }}
          YT_PLAYLIST_LIFE: ${{ secrets.YT_PLAYLIST_LIFE }}
          YT_PLAYLIST_MORNING: ${{ secrets.YT_PLAYLIST_MORNING }}
          YT_PLAYLIST_QUESTIONS: ${{ secrets.YT_PLAYLIST_QUESTIONS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: dineshmedagodasec/quotes-bot
